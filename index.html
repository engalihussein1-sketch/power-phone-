<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باور فون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F4;
    --surface:#FFFFFF;
    --ink:#1F2A3C;
    --ink-soft:#6B7280;
    --line:#E6E1D6;
    --brass:#B8862E;
    --brass-soft:#F3E6C8;
    --sage:#3F6C58;
    --sage-soft:#E1EDE6;
    --rust:#B5432F;
    --rust-soft:#F6E2DC;
    --font-ui:'Tajawal',sans-serif;
    --font-num:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-ui);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-bottom:76px;
    position:relative;
  }
  header.top{
    padding:20px 18px 16px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  header.top .row-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  header.top h1{
    font-size:19px;
    font-weight:700;
    margin:0 0 2px;
  }
  header.top .date{
    font-size:12px;
    color:var(--ink-soft);
  }
  .currency-edit{
    font-family:var(--font-num);
    font-size:12px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 8px;
    width:60px;
    text-align:center;
    background:var(--bg);
    color:var(--ink);
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    width:30px;
    height:30px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-btn svg{width:16px;height:16px;}
  .hero{
    margin-top:16px;
    display:flex;
    gap:10px;
  }
  .hero-main{
    flex:1.3;
    background:var(--ink);
    border-radius:16px;
    padding:16px 18px;
    color:#fff;
  }
  .hero-main .label{
    font-size:12px;
    color:#C9CDD4;
    margin-bottom:6px;
  }
  .hero-main .num{
    font-family:var(--font-num);
    font-size:26px;
    font-weight:600;
    color:var(--brass-soft);
    direction:ltr;
    display:block;
    text-align:right;
  }
  .hero-side{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .hero-chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    flex:1;
  }
  .hero-chip .label{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .hero-chip .num{
    font-family:var(--font-num);
    font-size:16px;
    font-weight:600;
    direction:ltr;
    display:block;
    text-align:right;
  }
  main{
    flex:1;
    padding:16px;
  }
  .tab{display:none;}
  .tab.active{display:block;}
  .picker{
    position:relative;
  }
  .picker-results{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    right:0;left:0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    max-height:220px;
    overflow-y:auto;
    z-index:15;
  }
  .picker-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    font-size:13.5px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .picker-item:last-child{border-bottom:none;}
  .picker-item:hover, .picker-item:active{background:var(--bg);}
  .picker-item .picker-name{font-weight:600;flex:1;}
  .picker-item .picker-qty{
    font-family:var(--font-num);
    font-size:11.5px;
    color:var(--sage);
    white-space:nowrap;
  }
  .picker-empty{
    padding:14px 12px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }
  .search-wrap{
    position:relative;
    margin-bottom:12px;
  }
  .search-wrap svg{
    position:absolute;
    top:50%;right:13px;
    transform:translateY(-50%);
    width:16px;height:16px;
    color:var(--ink-soft);
    pointer-events:none;
  }
  .search-wrap input{
    width:100%;
    font-family:var(--font-ui);
    font-size:14px;
    padding:10px 38px 10px 12px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--surface);
    color:var(--ink);
  }
  .search-wrap input:focus{
    outline:none;
    border-color:var(--brass);
  }
  h2.section-title{
    font-size:15px;
    font-weight:700;
    margin:4px 0 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
  }
  .product-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .product-row .info{flex:1;min-width:0;}
  .product-row .name{
    font-weight:700;
    font-size:14.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .product-row .model{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .product-row .prices{
    font-family:var(--font-num);
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    direction:ltr;
    text-align:right;
  }
  .qty-badge{
    font-family:var(--font-num);
    font-weight:600;
    font-size:13px;
    padding:5px 10px;
    border-radius:20px;
    background:var(--sage-soft);
    color:var(--sage);
    white-space:nowrap;
  }
  .qty-badge.low{
    background:var(--rust-soft);
    color:var(--rust);
  }
  .row-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .btn{
    font-family:var(--font-ui);
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:#fff;width:100%;}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  .btn-danger-text{background:none;color:var(--rust);font-size:12.5px;padding:6px 4px;}
  .btn-small{padding:6px 10px;font-size:12px;}
  form .field{margin-bottom:12px;}
  form label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:500;
  }
  form input, form select{
    width:100%;
    font-family:var(--font-ui);
    font-size:14.5px;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg);
    color:var(--ink);
  }
  form input:focus, form select:focus{
    outline:none;
    border-color:var(--brass);
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .empty-state .small{font-size:13px;}
  .toggle-group{
    display:flex;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:3px;
    margin-bottom:14px;
  }
  .toggle-group button{
    flex:1;
    border:none;
    background:none;
    padding:8px;
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    border-radius:8px;
    cursor:pointer;
  }
  .toggle-group button.active{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .filter-pills{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    overflow-x:auto;
  }
  .filter-pills button{
    border:1px solid var(--line);
    background:var(--surface);
    padding:6px 13px;
    border-radius:20px;
    font-family:var(--font-ui);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
  }
  .filter-pills button.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .txn-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .txn-row:last-child{border-bottom:none;}
  .txn-badge{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    display:inline-block;
    margin-bottom:3px;
  }
  .txn-badge.sale{background:var(--sage-soft);color:var(--sage);}
  .txn-badge.purchase{background:var(--brass-soft);color:var(--brass);}
  .txn-name{font-size:13.5px;font-weight:600;}
  .txn-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .txn-num{
    font-family:var(--font-num);
    font-size:14px;
    font-weight:600;
    direction:ltr;
    text-align:left;
  }
  .txn-num.profit{color:var(--sage);}
  nav.bottom{
    position:fixed;
    bottom:0;left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    font-family:var(--font-ui);
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  nav.bottom button.active{color:var(--ink);}
  nav.bottom button svg{width:21px;height:21px;}
  .toast{
    position:fixed;
    bottom:86px;left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, bottom .25s;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1;bottom:96px;}
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,16,10,.5);
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--surface);
    width:100%;
    max-width:480px;
    border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .modal-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:10px;
  }
  .modal-text{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:16px;
    line-height:1.6;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .modal-actions .btn{flex:1;}
  .btn-danger{background:var(--rust);color:#fff;}
  .loading{
    display:flex;
    align-items:center;
    justify-content:center;
    height:60vh;
    color:var(--ink-soft);
    font-size:13px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading" class="loading">جارِ التحميل...</div>
  <div id="real-app" style="display:none;">
    <header class="top">
      <div class="row-top">
        <div>
          <h1>باور فون</h1>
          <div class="date" id="today-date"></div>
        </div>
        <div class="header-actions">
          <input class="currency-edit" id="currency-input" maxlength="6" title="رمز العملة">
          <button class="icon-btn" id="backup-btn" title="نسخة احتياطية">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          </button>
        </div>
      </div>
      <div class="hero">
        <div class="hero-main">
          <div class="label">صافي الربح (كل الفترات)</div>
          <span class="num" id="hero-profit">0</span>
        </div>
        <div class="hero-side">
          <div class="hero-chip">
            <div class="label">قيمة المخزون</div>
            <span class="num" id="hero-inventory-value">0</span>
          </div>
          <div class="hero-chip">
            <div class="label">عدد القطع</div>
            <span class="num" id="hero-inventory-count">0</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <!-- المخزون -->
      <section class="tab active" id="tab-inventory">
        <h2 class="section-title">
          <span>المخزون</span>
        </h2>
        <div class="search-wrap">
          <input type="text" id="inventory-search" placeholder="ابحث باسم الشاشة أو الموديل...">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </div>
        <div id="inventory-list"></div>
        <div class="card">
          <h2 class="section-title" style="margin-top:0;">إضافة منتج جديد</h2>
          <form id="form-new-product">
            <div class="field">
              <label>اسم الشاشة</label>
              <input type="text" id="np-name" required placeholder="مثال: شاشة آيفون 13">
            </div>
            <div class="field-row">
              <div class="field">
                <label>الموديل / التفاصيل</label>
                <input type="text" id="np-model" placeholder="OLED أصلي / تقليد فحص أول">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>الكمية</label>
                <input type="number" id="np-qty" min="0" step="1" required placeholder="0">
              </div>
              <div class="field">
                <label>سعر الشراء (للقطعة)</label>
                <input type="number" id="np-buy" min="0" step="0.01" required placeholder="0">
              </div>
              <div class="field">
                <label>سعر البيع (للقطعة)</label>
                <input type="number" id="np-sell" min="0" step="0.01" required placeholder="0">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">إضافة المنتج</button>
          </form>
        </div>
      </section>

      <!-- بيع -->
      <section class="tab" id="tab-sell">
        <h2 class="section-title"><span>تسجيل عملية بيع</span></h2>
        <div class="card" id="sell-card">
          <form id="form-sell">
            <div class="field">
              <label>الشاشة</label>
              <div class="picker">
                <input type="text" id="sell-product-input" autocomplete="off" placeholder="اكتب اسم الشاشة أو الموديل..." required>
                <div class="picker-results" id="sell-product-results"></div>
              </div>
              <input type="hidden" id="sell-product">
            </div>
            <div class="field-row">
              <div class="field">
                <label>الكمية</label>
                <input type="number" id="sell-qty" min="1" step="1" required placeholder="1">
              </div>
              <div class="field">
                <label>سعر البيع للقطعة</label>
                <input type="number" id="sell-price" min="0" step="0.01" required>
              </div>
            </div>
            <div class="field">
              <label>الإجمالي المتوقع</label>
              <input type="text" id="sell-total-preview" disabled>
            </div>
            <button type="submit" class="btn btn-primary">تسجيل البيع</button>
          </form>
        </div>
      </section>

      <!-- شراء -->
      <section class="tab" id="tab-buy">
        <h2 class="section-title"><span>تسجيل عملية شراء</span></h2>
        <div class="toggle-group">
          <button type="button" class="active" data-mode="existing" id="buy-mode-existing">تزويد مخزون موجود</button>
          <button type="button" data-mode="new" id="buy-mode-new">منتج جديد</button>
        </div>
        <div class="card">
          <form id="form-buy-existing">
            <div class="field">
              <label>الشاشة</label>
              <div class="picker">
                <input type="text" id="buy-product-input" autocomplete="off" placeholder="اكتب اسم الشاشة أو الموديل..." required>
                <div class="picker-results" id="buy-product-results"></div>
              </div>
              <input type="hidden" id="buy-product">
            </div>
            <div class="field-row">
              <div class="field">
                <label>الكمية المشتراة</label>
                <input type="number" id="buy-qty" min="1" step="1" required placeholder="1">
              </div>
              <div class="field">
                <label>سعر الشراء للقطعة</label>
                <input type="number" id="buy-price" min="0" step="0.01" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">تسجيل الشراء وتحديث المخزون</button>
          </form>
        </div>
      </section>

      <!-- تقارير -->
      <section class="tab" id="tab-reports">
        <h2 class="section-title"><span>تقرير الأرباح</span></h2>
        <div class="filter-pills" id="report-filters">
          <button data-range="all" class="active">الكل</button>
          <button data-range="today">اليوم</button>
          <button data-range="week">هذا الأسبوع</button>
          <button data-range="month">هذا الشهر</button>
        </div>
        <div class="card">
          <div class="txn-row">
            <span class="txn-name">إجمالي المبيعات</span>
            <span class="txn-num" id="rep-sales">0</span>
          </div>
          <div class="txn-row">
            <span class="txn-name">تكلفة البضاعة المباعة</span>
            <span class="txn-num" id="rep-cogs">0</span>
          </div>
          <div class="txn-row">
            <span class="txn-name">صافي الربح</span>
            <span class="txn-num profit" id="rep-profit">0</span>
          </div>
          <div class="txn-row">
            <span class="txn-name">إجمالي المشتريات (تكلفة تزويد المخزون)</span>
            <span class="txn-num" id="rep-purchases">0</span>
          </div>
        </div>
        <h2 class="section-title" style="margin-top:18px;"><span>سجل العمليات</span></h2>
        <div class="card" id="txn-list-card">
          <div id="txn-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom">
      <button data-tab="inventory" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
        المخزون
      </button>
      <button data-tab="sell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 7H6"/></svg>
        بيع
      </button>
      <button data-tab="buy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12V8a2 2 0 0 0-2-2h-3l-3-3-3 3H6a2 2 0 0 0-2 2v4"/><path d="M4 12h16l-1.5 8.5a2 2 0 0 1-2 1.5H7.5a2 2 0 0 1-2-1.5L4 12z"/><path d="M12 12v5"/><path d="M9.5 14.5L12 17l2.5-2.5"/></svg>
        شراء
      </button>
      <button data-tab="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        التقارير
      </button>
    </nav>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
let state = { settings:{ currency:'د.ع' }, products:[], transactions:[] };
const STORE_KEY = 'shop-data-screens';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('en-US'); }
function money(n){ return fmt(n)+' '+state.settings.currency; }
function todayISO(){ return new Date().toISOString(); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({settings:{currency:'د.ع'},products:[],transactions:[]}, parsed);
    }
  }catch(e){
    // no data yet, keep defaults
  }
}

async function saveData(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    showToast('تعذر الحفظ، حاول مرة أخرى');
  }
}

// ---------- rendering ----------
function renderAll(){
  renderHero();
  renderInventory();
  renderReports();
}

function renderHero(){
  const totals = computeTotals(state.transactions);
  document.getElementById('hero-profit').textContent = money(totals.profit);
  const invValue = state.products.reduce((s,p)=>s+p.qty*p.buyPrice,0);
  const invCount = state.products.reduce((s,p)=>s+p.qty,0);
  document.getElementById('hero-inventory-value').textContent = money(invValue);
  document.getElementById('hero-inventory-count').textContent = invCount;
}

function renderInventory(){
  const list = document.getElementById('inventory-list');
  if(state.products.length===0){
    list.innerHTML = `<div class="empty-state"><div class="big">لا يوجد منتجات بعد</div><div class="small">أضف أول شاشة بالنموذج بالأسفل</div></div>`;
    return;
  }
  const term = (document.getElementById('inventory-search').value||'').trim().toLowerCase();
  const filtered = term
    ? state.products.filter(p =>
        (p.name||'').toLowerCase().includes(term) ||
        (p.model||'').toLowerCase().includes(term))
    : state.products;
  if(filtered.length===0){
    list.innerHTML = `<div class="empty-state"><div class="big">لا يوجد نتائج</div><div class="small">جرّب كلمة بحث ثانية</div></div>`;
    return;
  }
  list.innerHTML = filtered.map(p=>`
    <div class="card" data-id="${p.id}">
      <div class="product-row">
        <div class="info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="model">${escapeHtml(p.model||'')}</div>
          <div class="prices">شراء ${money(p.buyPrice)} · بيع ${money(p.sellPrice)}</div>
        </div>
        <span class="qty-badge ${p.qty<=2?'low':''}">${p.qty} قطعة</span>
      </div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-small edit-product" data-id="${p.id}">تعديل الأسعار</button>
        <button class="btn btn-danger-text delete-product" data-id="${p.id}">حذف</button>
      </div>
    </div>
  `).join('');
}

function setupProductPicker({inputId, hiddenId, resultsId, getPool, onSelect}){
  const input = document.getElementById(inputId);
  const hidden = document.getElementById(hiddenId);
  const results = document.getElementById(resultsId);
  if(!input) return;

  function displayName(p){ return p.name + (p.model ? (' - '+p.model) : ''); }

  function paint(term){
    const pool = getPool();
    const t = term.trim().toLowerCase();
    const list = t
      ? pool.filter(p => (p.name||'').toLowerCase().includes(t) || (p.model||'').toLowerCase().includes(t))
      : pool;
    if(list.length===0){
      results.innerHTML = `<div class="picker-empty">لا يوجد نتائج مطابقة</div>`;
    } else {
      results.innerHTML = list.map(p=>`
        <div class="picker-item" data-id="${p.id}">
          <span class="picker-name">${escapeHtml(p.name)}${p.model?(' - '+escapeHtml(p.model)):''}</span>
          <span class="picker-qty">متوفر ${p.qty}</span>
        </div>`).join('');
    }
    results.style.display='block';
  }

  input.addEventListener('focus', ()=> paint(input.value));
  input.addEventListener('input', ()=>{
    hidden.value='';
    paint(input.value);
  });
  results.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.picker-item');
    if(!item) return;
    const id = item.dataset.id;
    const p = getPool().find(pr=>pr.id===id) || state.products.find(pr=>pr.id===id);
    if(!p) return;
    hidden.value = id;
    input.value = displayName(p);
    results.style.display='none';
    if(onSelect) onSelect(p);
  });
  document.addEventListener('click', (e)=>{
    if(e.target!==input && !results.contains(e.target)){
      results.style.display='none';
    }
  });
}

let currentReportRange = 'all';
function renderReports(){
  const filtered = filterByRange(state.transactions, currentReportRange);
  const totals = computeTotals(filtered);
  document.getElementById('rep-sales').textContent = money(totals.sales);
  document.getElementById('rep-cogs').textContent = money(totals.cogs);
  document.getElementById('rep-profit').textContent = money(totals.profit);
  document.getElementById('rep-purchases').textContent = money(totals.purchases);

  const list = document.getElementById('txn-list');
  const sorted = [...filtered].sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(sorted.length===0){
    list.innerHTML = `<div class="empty-state"><div class="big">لا توجد عمليات</div><div class="small">سجل أول عملية بيع أو شراء</div></div>`;
    return;
  }
  list.innerHTML = sorted.map(t=>{
    const d = new Date(t.date);
    const dateStr = d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    if(t.type==='sale'){
      return `<div class="txn-row">
        <div>
          <span class="txn-badge sale">بيع</span>
          <div class="txn-name">${escapeHtml(t.productName)}</div>
          <div class="txn-meta">${t.qty} × ${money(t.unitPrice)} · ${dateStr}</div>
        </div>
        <div>
          <div class="txn-num">${money(t.total)}</div>
          <div class="txn-num profit">+${money(t.profit)}</div>
        </div>
      </div>`;
    } else {
      return `<div class="txn-row">
        <div>
          <span class="txn-badge purchase">شراء</span>
          <div class="txn-name">${escapeHtml(t.productName)}</div>
          <div class="txn-meta">${t.qty} × ${money(t.unitPrice)} · ${dateStr}</div>
        </div>
        <div>
          <div class="txn-num">${money(t.total)}</div>
        </div>
      </div>`;
    }
  }).join('');
}

function computeTotals(transactions){
  let sales=0, cogs=0, purchases=0;
  transactions.forEach(t=>{
    if(t.type==='sale'){ sales+=t.total; cogs+=t.totalCost; }
    else if(t.type==='purchase'){ purchases+=t.total; }
  });
  return { sales, cogs, profit: sales-cogs, purchases };
}

function filterByRange(transactions, range){
  if(range==='all') return transactions;
  const now = new Date();
  return transactions.filter(t=>{
    const d = new Date(t.date);
    if(range==='today'){
      return d.toDateString()===now.toDateString();
    }
    if(range==='week'){
      const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
      return d>=weekAgo;
    }
    if(range==='month'){
      return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    }
    return true;
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- events ----------
document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('inventory-search').addEventListener('input', renderInventory);

document.getElementById('currency-input').addEventListener('change', async (e)=>{
  state.settings.currency = e.target.value.trim() || '$';
  await saveData();
  renderAll();
});

document.getElementById('form-new-product').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('np-name').value.trim();
  const model = document.getElementById('np-model').value.trim();
  const qty = parseInt(document.getElementById('np-qty').value,10);
  const buy = parseFloat(document.getElementById('np-buy').value);
  const sell = parseFloat(document.getElementById('np-sell').value);
  if(!name || isNaN(qty) || isNaN(buy) || isNaN(sell)) return;
  const product = { id: uid(), name, model, qty, buyPrice: buy, sellPrice: sell };
  state.products.push(product);
  if(qty>0){
    state.transactions.push({
      id: uid(), type:'purchase', productId: product.id, productName: name,
      qty, unitPrice: buy, total: qty*buy, date: todayISO()
    });
  }
  await saveData();
  e.target.reset();
  renderAll();
  showToast('تمت إضافة المنتج');
});

function openModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
}
function confirmModal(message, opts={}){
  const title = opts.title || 'تأكيد الحذف';
  const confirmLabel = opts.confirmLabel || 'حذف';
  const confirmClass = opts.danger===false ? 'btn-primary' : 'btn-danger';
  return new Promise(resolve=>{
    openModal(`
      <div class="modal-title">${escapeHtml(title)}</div>
      <div class="modal-text">${escapeHtml(message)}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">إلغاء</button>
        <button class="btn ${confirmClass}" id="modal-confirm">${escapeHtml(confirmLabel)}</button>
      </div>
    `);
    document.getElementById('modal-cancel').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('modal-confirm').onclick = ()=>{ closeModal(); resolve(true); };
  });
}
function editPricesModal(p){
  return new Promise(resolve=>{
    openModal(`
      <div class="modal-title">تعديل أسعار "${escapeHtml(p.name)}"</div>
      <div class="field">
        <label>سعر الشراء للقطعة</label>
        <input type="number" id="modal-buy" value="${p.buyPrice}" step="0.01" min="0">
      </div>
      <div class="field">
        <label>سعر البيع للقطعة</label>
        <input type="number" id="modal-sell" value="${p.sellPrice}" step="0.01" min="0">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">إلغاء</button>
        <button class="btn btn-primary" id="modal-save">حفظ</button>
      </div>
    `);
    document.getElementById('modal-cancel').onclick = ()=>{ closeModal(); resolve(null); };
    document.getElementById('modal-save').onclick = ()=>{
      const buy = parseFloat(document.getElementById('modal-buy').value);
      const sell = parseFloat(document.getElementById('modal-sell').value);
      closeModal();
      resolve({buy, sell});
    };
  });
}

function openBackupModal(){
  openModal(`
    <div class="modal-title">النسخة الاحتياطية</div>
    <div class="modal-text">"تصدير كجدول" بيديك ملف مقروء تفتحه بأي مكان (Excel، الملفات، إلخ) وتشوف بياناتك متل ما هي بالتطبيق. "نسخة احتياطية" بتنفع لاستعادة بياناتك بنفس التطبيق بس.</div>
    <div class="modal-actions" style="flex-direction:column;">
      <button class="btn btn-primary" id="btn-export-csv">تصدير كجدول (Excel)</button>
      <button class="btn btn-ghost" id="btn-export">نسخة احتياطية (للاستعادة لاحقًا)</button>
      <button class="btn btn-ghost" id="btn-import">استيراد نسخة احتياطية</button>
    </div>
    <input type="file" id="import-file-input" accept="application/json" style="display:none;">
  `);
  document.getElementById('btn-export-csv').onclick = exportCSV;
  document.getElementById('btn-export').onclick = exportBackup;
  document.getElementById('btn-import').onclick = ()=> document.getElementById('import-file-input').click();
  document.getElementById('import-file-input').addEventListener('change', handleImportFile);
}
document.getElementById('backup-btn').addEventListener('click', openBackupModal);

function csvEscape(val){
  const str = String(val);
  if(str.includes(',') || str.includes('"') || str.includes('\n')){
    return '"' + str.replace(/"/g,'""') + '"';
  }
  return str;
}

function buildCSV(){
  const lines = [];
  lines.push('المخزون الحالي');
  lines.push(['اسم الشاشة','الموديل','الكمية','سعر الشراء','سعر البيع','قيمة المخزون'].map(csvEscape).join(','));
  state.products.forEach(p=>{
    lines.push([p.name, p.model||'', p.qty, p.buyPrice, p.sellPrice, +(p.qty*p.buyPrice).toFixed(2)].map(csvEscape).join(','));
  });
  lines.push('');
  lines.push('سجل العمليات');
  lines.push(['التاريخ','النوع','الشاشة','الكمية','السعر للقطعة','الإجمالي','الربح'].map(csvEscape).join(','));
  const sorted = [...state.transactions].sort((a,b)=> new Date(a.date)-new Date(b.date));
  sorted.forEach(t=>{
    const dateStr = new Date(t.date).toLocaleString('ar-EG');
    const typeStr = t.type==='sale' ? 'بيع' : 'شراء';
    const profitStr = t.type==='sale' ? +t.profit.toFixed(2) : '';
    lines.push([dateStr, typeStr, t.productName, t.qty, t.unitPrice, t.total, profitStr].map(csvEscape).join(','));
  });
  return lines.join('\n');
}

function exportCSV(){
  const csv = buildCSV();
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `باور-فون-بيانات-${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeModal();
  showToast('تم تصدير الجدول');
}

function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `باور-فون-نسخة-احتياطية-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeModal();
  showToast('تم تصدير النسخة الاحتياطية');
}

async function handleImportFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.products) || !Array.isArray(parsed.transactions)){
      showToast('ملف غير صالح');
      return;
    }
    const ok = await confirmModal(
      'استيراد هذه النسخة بيستبدل كل بياناتك الحالية بشكل نهائي. متأكد؟',
      { title:'استيراد نسخة احتياطية', confirmLabel:'استيراد واستبدال' }
    );
    if(!ok) return;
    state = Object.assign({settings:{currency:'د.ع'},products:[],transactions:[]}, parsed);
    await saveData();
    document.getElementById('currency-input').value = state.settings.currency;
    renderAll();
    showToast('تم استيراد النسخة الاحتياطية');
  }catch(err){
    showToast('تعذر قراءة الملف');
  }
}

document.getElementById('inventory-list').addEventListener('click', async (e)=>{
  const delBtn = e.target.closest('.delete-product');
  const editBtn = e.target.closest('.edit-product');
  if(delBtn){
    const id = delBtn.dataset.id;
    const p = state.products.find(p=>p.id===id);
    if(!p) return;
    const ok = await confirmModal(`حذف "${p.name}" من المخزون؟`);
    if(ok){
      state.products = state.products.filter(pr=>pr.id!==id);
      await saveData();
      renderAll();
      showToast('تم الحذف');
    }
  }
  if(editBtn){
    const id = editBtn.dataset.id;
    const p = state.products.find(p=>p.id===id);
    if(!p) return;
    const result = await editPricesModal(p);
    if(result){
      if(!isNaN(result.buy)) p.buyPrice = result.buy;
      if(!isNaN(result.sell)) p.sellPrice = result.sell;
      await saveData();
      renderAll();
      showToast('تم تحديث الأسعار');
    }
  }
});

setupProductPicker({
  inputId:'sell-product-input', hiddenId:'sell-product', resultsId:'sell-product-results',
  getPool: ()=> state.products.filter(p=>p.qty>0),
  onSelect: (p)=>{ document.getElementById('sell-price').value = p.sellPrice; updateSellPreview(); }
});
document.getElementById('sell-qty').addEventListener('input', updateSellPreview);
document.getElementById('sell-price').addEventListener('input', updateSellPreview);
function updateSellPreview(){
  const qty = parseFloat(document.getElementById('sell-qty').value)||0;
  const price = parseFloat(document.getElementById('sell-price').value)||0;
  document.getElementById('sell-total-preview').value = money(qty*price);
}

document.getElementById('form-sell').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const productId = document.getElementById('sell-product').value;
  if(!productId){ showToast('اختر الشاشة من نتائج البحث'); return; }
  const p = state.products.find(p=>p.id===productId);
  if(!p) return;
  const qty = parseInt(document.getElementById('sell-qty').value,10);
  const price = parseFloat(document.getElementById('sell-price').value);
  if(isNaN(qty) || qty<1 || isNaN(price)) return;
  if(qty>p.qty){ showToast(`الكمية المتوفرة فقط ${p.qty}`); return; }
  p.qty -= qty;
  const total = qty*price;
  const totalCost = qty*p.buyPrice;
  state.transactions.push({
    id: uid(), type:'sale', productId: p.id, productName: p.name,
    qty, unitPrice: price, total, unitCost: p.buyPrice, totalCost,
    profit: total-totalCost, date: todayISO()
  });
  await saveData();
  e.target.reset();
  renderAll();
  showToast('تم تسجيل عملية البيع');
});

let buyMode = 'existing';
document.getElementById('buy-mode-existing').addEventListener('click', ()=>setBuyMode('existing'));
document.getElementById('buy-mode-new').addEventListener('click', ()=>setBuyMode('new'));
function setBuyMode(mode){
  buyMode = mode;
  document.getElementById('buy-mode-existing').classList.toggle('active', mode==='existing');
  document.getElementById('buy-mode-new').classList.toggle('active', mode==='new');
  renderBuyForm();
}

function renderBuyForm(){
  const card = document.querySelector('#tab-buy .card');
  if(buyMode==='existing'){
    card.innerHTML = `
      <form id="form-buy-existing">
        <div class="field">
          <label>الشاشة</label>
          <div class="picker">
            <input type="text" id="buy-product-input" autocomplete="off" placeholder="اكتب اسم الشاشة أو الموديل..." required>
            <div class="picker-results" id="buy-product-results"></div>
          </div>
          <input type="hidden" id="buy-product">
        </div>
        <div class="field-row">
          <div class="field">
            <label>الكمية المشتراة</label>
            <input type="number" id="buy-qty" min="1" step="1" required placeholder="1">
          </div>
          <div class="field">
            <label>سعر الشراء للقطعة</label>
            <input type="number" id="buy-price" min="0" step="0.01" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">تسجيل الشراء وتحديث المخزون</button>
      </form>`;
    setupProductPicker({
      inputId:'buy-product-input', hiddenId:'buy-product', resultsId:'buy-product-results',
      getPool: ()=> state.products,
      onSelect: (p)=>{ document.getElementById('buy-price').value = p.buyPrice; }
    });
    document.getElementById('form-buy-existing').addEventListener('submit', submitBuyExisting);
  } else {
    card.innerHTML = `
      <form id="form-buy-new">
        <div class="field">
          <label>اسم الشاشة</label>
          <input type="text" id="bn-name" required placeholder="مثال: شاشة سامسونج A54">
        </div>
        <div class="field">
          <label>الموديل / التفاصيل</label>
          <input type="text" id="bn-model" placeholder="OLED أصلي / تقليد فحص أول">
        </div>
        <div class="field-row">
          <div class="field">
            <label>الكمية</label>
            <input type="number" id="bn-qty" min="1" step="1" required placeholder="1">
          </div>
          <div class="field">
            <label>سعر الشراء للقطعة</label>
            <input type="number" id="bn-buy" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label>سعر البيع للقطعة</label>
            <input type="number" id="bn-sell" min="0" step="0.01" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">تسجيل الشراء وإضافة المنتج</button>
      </form>`;
    document.getElementById('form-buy-new').addEventListener('submit', submitBuyNew);
  }
}

async function submitBuyExisting(e){
  e.preventDefault();
  const productId = document.getElementById('buy-product').value;
  if(!productId){ showToast('اختر الشاشة من نتائج البحث'); return; }
  const p = state.products.find(p=>p.id===productId);
  if(!p) return;
  const qty = parseInt(document.getElementById('buy-qty').value,10);
  const price = parseFloat(document.getElementById('buy-price').value);
  if(isNaN(qty) || qty<1 || isNaN(price)) return;
  const newQty = p.qty + qty;
  p.buyPrice = ((p.qty*p.buyPrice) + (qty*price)) / newQty;
  p.qty = newQty;
  state.transactions.push({
    id: uid(), type:'purchase', productId: p.id, productName: p.name,
    qty, unitPrice: price, total: qty*price, date: todayISO()
  });
  await saveData();
  e.target.reset();
  renderAll();
  showToast('تم تسجيل الشراء وتحديث المخزون');
}

async function submitBuyNew(e){
  e.preventDefault();
  const name = document.getElementById('bn-name').value.trim();
  const model = document.getElementById('bn-model').value.trim();
  const qty = parseInt(document.getElementById('bn-qty').value,10);
  const buy = parseFloat(document.getElementById('bn-buy').value);
  const sell = parseFloat(document.getElementById('bn-sell').value);
  if(!name || isNaN(qty) || qty<1 || isNaN(buy) || isNaN(sell)) return;
  const product = { id: uid(), name, model, qty, buyPrice: buy, sellPrice: sell };
  state.products.push(product);
  state.transactions.push({
    id: uid(), type:'purchase', productId: product.id, productName: name,
    qty, unitPrice: buy, total: qty*buy, date: todayISO()
  });
  await saveData();
  e.target.reset();
  renderAll();
  showToast('تم تسجيل الشراء وإضافة المنتج');
}

document.getElementById('report-filters').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#report-filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentReportRange = btn.dataset.range;
  renderReports();
});

// ---------- init ----------
(async function init(){
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-EG',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  await loadData();
  document.getElementById('currency-input').value = state.settings.currency;
  renderAll();
  renderBuyForm();
  document.getElementById('loading').style.display='none';
  document.getElementById('real-app').style.display='block';
})();
</script>
